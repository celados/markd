appId: app.usemarkd
productName: Markd
directories:
  output: release/electron
  buildResources: build-resources
files:
  - dist/**
  - dist-electron/**
  - package.json
  # fff/ffi-rs publish every platform binary as dependencies. Dependency
  # discovery follows those declarations, so explicitly keep foreign native
  # payloads out of the arm64 artifact instead of shipping dead code.
  - '!node_modules/@celados/fff-bin-darwin-x64/**/*'
  - '!node_modules/@yuuang/ffi-rs-android-arm64/**/*'
  - '!node_modules/@yuuang/ffi-rs-darwin-x64/**/*'
  - '!node_modules/@yuuang/ffi-rs-linux-arm-gnueabihf/**/*'
  - '!node_modules/@yuuang/ffi-rs-linux-arm64-gnu/**/*'
  - '!node_modules/@yuuang/ffi-rs-linux-arm64-musl/**/*'
  - '!node_modules/@yuuang/ffi-rs-linux-x64-gnu/**/*'
  - '!node_modules/@yuuang/ffi-rs-linux-x64-musl/**/*'
  - '!node_modules/@yuuang/ffi-rs-win32-arm64-msvc/**/*'
  - '!node_modules/@yuuang/ffi-rs-win32-ia32-msvc/**/*'
  - '!node_modules/@yuuang/ffi-rs-win32-x64-msvc/**/*'
asar: true
asarUnpack:
  # fff passes its dylib path to ffi-rs, so both native layers must be real
  # files. The packaged smoke rejects an ASAR-only or missing native payload.
  - node_modules/@celados/fff-bin-darwin-arm64/**/*
  - node_modules/@yuuang/ffi-rs-darwin-arm64/**/*
npmRebuild: false
publish:
  provider: github
  owner: celados
  repo: markd
mac:
  category: public.app-category.productivity
  icon: build-resources/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
artifactName: Markd-${version}-${os}-${arch}.${ext}
dmg:
  # The notarized DMG is an installer, not an updater payload. Stapling changes
  # its bytes, so publishing pre-staple update metadata would be incorrect.
  writeUpdateInfo: false
