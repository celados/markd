allowBuilds:
  electron-winstaller: false
  esbuild: true
autoInstallPeers: false
peerDependencyRules:
  # The package root is the Vanilla runtime; React peers belong only to its
  # explicit `/react` export and would violate Riffle's Octane-only renderer.
  ignoreMissing:
    # electron-builder's Windows target is irrelevant to the macOS-only
    # package pipeline, but app-builder-lib declares it as a global peer.
    - electron-builder-squirrel-windows
    - react
    - react-dom
minimumReleaseAgeExclude:
  - '@celados/fff-bin-darwin-arm64@0.10.2-nightly.dbc0f62'
  - '@celados/fff-bin-darwin-x64@0.10.2-nightly.dbc0f62'
  - '@celados/fff-node@0.10.2-nightly.dbc0f62'
