name: Release Electron Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.9
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-electron-linux-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Electron Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag version
        run: |
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$tag_sha" || {
            echo "Checked-out source does not match $RELEASE_TAG" >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$version" = "$package_version" || {
            echo "Tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run release gates
        run: |
          pnpm test
          pnpm run build

      - name: Build Electron AppImage and Debian package
        run: pnpm exec electron-builder --linux AppImage deb --publish never

      - name: Inspect native and updater payloads
        run: pnpm run package:verify

      - name: Run packaged utility smoke in background
        run: xvfb-run --auto-servernum env MARKD_E2E_BACKGROUND=1 pnpm run test:packaged

      - name: Verify release metadata
        run: |
          test -s release/electron/latest-linux.yml
          test -n "$(find release/electron -maxdepth 1 -name 'Markd-*.AppImage' -print -quit)"
          test -n "$(find release/electron -maxdepth 1 -name 'Markd-*.deb' -print -quit)"

      - name: Keep verified workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: markd-electron-linux-${{ env.VERSION }}
          path: |
            release/electron/Markd-*.AppImage
            release/electron/Markd-*.AppImage.blockmap
            release/electron/Markd-*.deb
            release/electron/latest-linux.yml
          if-no-files-found: error

      - name: Upload to GitHub release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Markd $VERSION" || \
            gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            release/electron/Markd-*.AppImage \
            release/electron/Markd-*.AppImage.blockmap \
            release/electron/Markd-*.deb \
            release/electron/latest-linux.yml \
            --clobber
