name: Release Electron macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload artifacts to a GitHub Release; requires a tag ref
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-electron-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed and notarized Electron macOS app
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0

      - name: Prepare persistent workspace
        run: |
          git reset --hard --quiet "$GITHUB_SHA"
          # Package outputs are isolated, while ignored dependency stores stay warm.
          git clean -fdqx release/electron dist dist-electron test-results

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate release contract
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          for value in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            test -n "${!value:-}" || {
              echo "$value is not configured" >&2
              exit 1
            }
          done
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
              exit 1
            }
          fi
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
          fi
          if [ "$publish" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publishing requires a tag ref." >&2
            exit 1
          fi
          {
            echo "VERSION=$version"
            echo "PUBLISH=$publish"
          } >> "$GITHUB_ENV"

      - name: Ensure Developer ID G2 intermediate
        run: |
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$intermediate"
          digest="$(shasum -a 256 "$intermediate" | awk '{print $1}')"
          test "$digest" = "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          fingerprint="$(openssl x509 -inform der -in "$intermediate" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          if ! security find-certificate -a -Z /Library/Keychains/System.keychain | grep -q "$fingerprint"; then
            sudo -n security import "$intermediate" -k /Library/Keychains/System.keychain >/dev/null
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: |
          pnpm test
          pnpm run build

      - name: Build, sign, and notarize Electron artifacts
        run: pnpm exec electron-builder --mac dmg zip --publish never -c.forceCodeSigning=true

      - name: Inspect native and updater payloads
        run: pnpm run package:verify

      - name: Verify signing, notarization, and updater metadata
        run: |
          app="$(find release/electron -type d -name Markd.app -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          native="$(find "$app/Contents/Resources/app.asar.unpacked" -type f \( -name 'libfff_c.dylib' -o -name '*.node' \))"
          test -n "$native"
          while IFS= read -r file; do codesign --verify --strict --verbose=2 "$file"; done <<< "$native"
          test -s release/electron/latest-mac.yml

      - name: Run packaged utility smoke in background
        run: MARKD_E2E_BACKGROUND=1 pnpm run test:packaged

      - name: Keep verified workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: markd-electron-macos-${{ env.VERSION }}
          path: |
            release/electron/Markd-*.dmg
            release/electron/Markd-*.dmg.blockmap
            release/electron/Markd-*.zip
            release/electron/Markd-*.zip.blockmap
            release/electron/latest-mac.yml
          if-no-files-found: error

      - name: Upload to GitHub release
        if: env.PUBLISH == 'true'
        env:
          RELEASE_TAG: v${{ env.VERSION }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Markd $VERSION" || \
            gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            release/electron/Markd-*.dmg \
            release/electron/Markd-*.dmg.blockmap \
            release/electron/Markd-*.zip \
            release/electron/Markd-*.zip.blockmap \
            release/electron/latest-mac.yml \
            --clobber
