name: Release Electron macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload artifacts to a GitHub Release; requires a tag ref
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-electron-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Reject non-tag dispatches
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a tag ref
        run: |
          test "$GITHUB_REF_TYPE" = "tag" || {
            echo "Electron releases must be dispatched from an existing tag ref." >&2
            exit 1
          }

  build:
    name: Build signed and notarized Electron macOS app
    needs: guard
    # A persistent runner is an OS authority boundary; manual branch runs must never execute on it.
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare persistent workspace
        run: |
          git reset --hard --quiet "$GITHUB_SHA"
          git clean -fdq
          # Retain the expensive dependency tree, but purge ignored env/config files that could alter the bundle.
          git clean -fdqx -e /node_modules/
          # Native build output has no automatic GC on this shared 16 GB desktop runner.
          node_modules_gib="$(du -sg node_modules 2>/dev/null | cut -f1 || echo 0)"
          if [ "${node_modules_gib:-0}" -gt 20 ]; then
            rm -rf node_modules
          fi
          rm -rf release/electron

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.celados.com
          scope: '@celados'

      - name: Validate release contract
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          test "$(git rev-parse HEAD)" = "$tag_commit" || {
            echo "Checked-out source does not match $GITHUB_REF_NAME" >&2
            exit 1
          }
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "Tag $GITHUB_REF_NAME is not reachable from origin/main" >&2
            exit 1
          }
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
          fi
          {
            echo "VERSION=$version"
            echo "PUBLISH=$publish"
          } >> "$GITHUB_ENV"

          node scripts/electron-artifacts.mjs "$version" arm64 --github-env >> "$GITHUB_ENV"

      - name: Ensure Developer ID G2 intermediate
        run: |
          intermediate="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$intermediate"
          digest="$(shasum -a 256 "$intermediate" | awk '{print $1}')"
          test "$digest" = "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"
          fingerprint="$(openssl x509 -inform der -in "$intermediate" -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':')"
          if ! security find-certificate -a -Z /Library/Keychains/System.keychain | grep -q "$fingerprint"; then
            sudo -n security import "$intermediate" -k /Library/Keychains/System.keychain >/dev/null
          fi

      - name: Preflight Developer ID signing identity
        env:
          CSC_LINK: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keychain="$RUNNER_TEMP/markd-signing-preflight-$run_key.keychain-db"
          keychain_list="$RUNNER_TEMP/markd-signing-preflight-$run_key-keychains.txt"
          keychain_list_tmp="$keychain_list.tmp"
          p12="$RUNNER_TEMP/markd-signing-preflight-$run_key.p12"
          probe="$RUNNER_TEMP/markd-signing-preflight-$run_key-probe"
          test ! -e "$keychain"
          test ! -e "$keychain_list"
          test ! -e "$keychain_list_tmp"
          test ! -e "$p12"
          test ! -e "$probe"
          security list-keychains -d user > "$keychain_list_tmp"
          # Publish only a successful snapshot; an empty search list is still valid state.
          mv "$keychain_list_tmp" "$keychain_list"
          umask 077
          printf '%s' "$CSC_LINK" | /usr/bin/base64 -D > "$p12"
          test -s "$p12"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" \
            -k "$keychain" \
            -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          identity_line="$(security find-identity -v -p codesigning "$keychain" | \
            awk '/Developer ID Application:/ { print; exit }')"
          test -n "$identity_line"
          identity_hash="$(printf '%s\n' "$identity_line" | awk '{ print $2 }')"
          test "$(printf '%s' "$identity_hash" | wc -c | tr -d ' ')" = "40"
          security find-key -t private "$keychain" >/dev/null
          existing_keychains=()
          while IFS= read -r line; do
            existing_keychains+=("${line//\"/}")
          done < "$keychain_list"
          # codesign resolves fingerprint identities through the user search list on this runner.
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          cp /usr/bin/true "$probe"
          codesign --force --timestamp=none --sign "$identity_hash" "$probe"
          codesign --verify --strict --verbose=2 "$probe"

      - name: Remove signing identity preflight
        if: always()
        run: |
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          keychain="$RUNNER_TEMP/markd-signing-preflight-$run_key.keychain-db"
          keychain_list="$RUNNER_TEMP/markd-signing-preflight-$run_key-keychains.txt"
          keychain_list_tmp="$keychain_list.tmp"
          p12="$RUNNER_TEMP/markd-signing-preflight-$run_key.p12"
          probe="$RUNNER_TEMP/markd-signing-preflight-$run_key-probe"
          failed=0
          if [ -f "$keychain_list" ]; then
            previous_keychains=()
            while IFS= read -r line; do
              previous_keychains+=("${line//\"/}")
            done < "$keychain_list"
            security list-keychains -d user -s "${previous_keychains[@]}" || failed=1
          fi
          if [ -e "$keychain" ]; then
            security delete-keychain "$keychain" || failed=1
          fi
          # A keychain failure must never strand the raw signing credential.
          rm -f "$p12" || failed=1
          rm -f "$probe" || failed=1
          rm -f "$keychain_list_tmp" || failed=1
          rm -f "$keychain_list" || failed=1
          test ! -e "$keychain" || failed=1
          test ! -e "$p12" || failed=1
          test ! -e "$probe" || failed=1
          test ! -e "$keychain_list_tmp" || failed=1
          test ! -e "$keychain_list" || failed=1
          exit "$failed"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: |
          pnpm test
          pnpm run build

      - name: Build, sign, and notarize Electron artifacts
        env:
          CSC_LINK: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac --arm64 --publish never -c.forceCodeSigning=true

      - name: Notarize and staple canonical DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          dmg="release/electron/$ELECTRON_DMG"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Inspect native and updater payloads
        run: pnpm run package:verify

      - name: Verify signing, notarization, and updater metadata
        run: |
          app="release/electron/mac-arm64/Markd.app"
          dmg="release/electron/$ELECTRON_DMG"
          test -d "$app"
          test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          unpacked="$app/Contents/Resources/app.asar.unpacked/node_modules"
          codesign --verify --strict --verbose=2 \
            "$unpacked/@celados/fff-bin-darwin-arm64/libfff_c.dylib"
          codesign --verify --strict --verbose=2 \
            "$unpacked/@yuuang/ffi-rs-darwin-arm64/ffi-rs.darwin-arm64.node"

      - name: Install canonical DMG in isolated Applications
        run: |
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install_parent="$RUNNER_TEMP/markd-installed-$run_key"
          install_root="$install_parent/Applications"
          mount_point="$(mktemp -d "$RUNNER_TEMP/markd-dmg.XXXXXX")"
          test ! -e "$install_parent"
          mkdir -p "$install_root"
          hdiutil attach "release/electron/$ELECTRON_DMG" \
            -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force >/dev/null 2>&1 || true' EXIT
          test -d "$mount_point/Markd.app"
          ditto "$mount_point/Markd.app" "$install_root/Markd.app"
          hdiutil detach "$mount_point"
          trap - EXIT
          {
            echo "INSTALLED_APP=$install_root/Markd.app"
            echo "INSTALLED_EXECUTABLE=$install_root/Markd.app/Contents/MacOS/Markd"
          } >> "$GITHUB_ENV"

      - name: Verify installed app signing and notarization
        run: |
          codesign --verify --deep --strict --verbose=2 "$INSTALLED_APP"
          spctl --assess --type execute --verbose=2 "$INSTALLED_APP"
          xcrun stapler validate "$INSTALLED_APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INSTALLED_APP/Contents/Info.plist")" = "app.usemarkd"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INSTALLED_APP/Contents/Info.plist")" = "$VERSION"

      - name: Run installed packaged journeys in background
        run: MARKD_E2E_BACKGROUND=1 pnpm run test:packaged -- "$INSTALLED_APP"

      - name: Build signed same-base Electron updater baseline
        env:
          CSC_LINK: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          baseline_version="0.1.10"
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          baseline_output="$RUNNER_TEMP/markd-baseline-$run_key"
          test ! -e "$baseline_output"
          pnpm exec electron-builder --mac zip --arm64 --publish never \
            -c.directories.output="$baseline_output" \
            -c.extraMetadata.version="$baseline_version" \
            -c.forceCodeSigning=true
          baseline_app="$baseline_output/mac-arm64/Markd.app"
          test -d "$baseline_app"
          test -f "$baseline_app/Contents/Resources/app-update.yml"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$baseline_app/Contents/Info.plist")" = "$baseline_version"
          codesign --verify --deep --strict --verbose=2 "$baseline_app"
          spctl --assess --type execute --verbose=2 "$baseline_app"
          xcrun stapler validate "$baseline_app"
          target_requirement="$(codesign -d -r- "$INSTALLED_APP" 2>&1 | sed -n 's/^designated => //p')"
          baseline_requirement="$(codesign -d -r- "$baseline_app" 2>&1 | sed -n 's/^designated => //p')"
          test -n "$target_requirement"
          test "$baseline_requirement" = "$target_requirement"

          local_root="$RUNNER_TEMP/markd-release-e2e-local-$run_key"
          public_root="$RUNNER_TEMP/markd-release-e2e-public-$run_key"
          test ! -e "$local_root"
          test ! -e "$public_root"
          mkdir -p "$local_root" "$public_root"
          ditto "$baseline_app" "$local_root/Markd.app"
          ditto "$baseline_app" "$public_root/Markd.app"
          {
            echo "BASELINE_VERSION=$baseline_version"
            echo "LOCAL_BASELINE_APP=$local_root/Markd.app"
            echo "PUBLIC_BASELINE_APP=$public_root/Markd.app"
          } >> "$GITHUB_ENV"

      # PRE-PUBLISH GATE: exact final ZIP must replace the signed same-base app through Squirrel/ShipIt.
      - name: Isolate local updater state
        run: |
          state_root="$(dirname "$LOCAL_BASELINE_APP")"
          backup_root="$RUNNER_TEMP/markd-updater-backup-local-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/updater-hygiene.mjs prepare "$LOCAL_BASELINE_APP" "$state_root" "$backup_root"
          echo "LOCAL_HYGIENE_BACKUP=$backup_root" >> "$GITHUB_ENV"

      - name: Verify local signed updater install and relaunch
        run: |
          MARKD_BASELINE_EXECUTABLE="$LOCAL_BASELINE_APP/Contents/MacOS/Markd" \
          MARKD_INSTALLED_APP="$LOCAL_BASELINE_APP" \
          MARKD_TARGET_VERSION="$VERSION" \
          MARKD_BASELINE_VERSION="$BASELINE_VERSION" \
          MARKD_ALLOWED_TEMP_ROOT="$RUNNER_TEMP" \
          MARKD_UPDATE_CHANNEL_DIR="$GITHUB_WORKSPACE/release/electron" \
            pnpm run test:updater

      - name: Restore local updater state
        if: always() && env.LOCAL_HYGIENE_BACKUP != ''
        run: node scripts/updater-hygiene.mjs restore "$LOCAL_HYGIENE_BACKUP"

      - name: Keep compact verification metadata
        uses: actions/upload-artifact@v7
        with:
          name: markd-electron-macos-${{ env.VERSION }}
          path: |
            release/electron/${{ env.ELECTRON_ZIP_BLOCKMAP }}
            release/electron/${{ env.ELECTRON_MANIFEST }}
          if-no-files-found: error

      - name: Create or resume canonical draft release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.VERSION }}
        run: |
          metadata="$RUNNER_TEMP/markd-draft-before-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$metadata" 2>/dev/null; then
            test "$(jq -r '[.draft, .prerelease] | @tsv' "$metadata")" = $'true\tfalse' || {
              echo "Release $RELEASE_TAG must be a non-prerelease draft before resume." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --latest=false \
              --verify-tag \
              --notes-file RELEASE_NOTES.md \
              --title "Markd $VERSION"
          fi
          gh release edit "$RELEASE_TAG" \
            --draft \
            --latest=false \
            --prerelease=false \
            --verify-tag \
            --notes-file RELEASE_NOTES.md \
            --title "Markd $VERSION"

      - name: Upload canonical draft assets without clobbering
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.VERSION }}
        run: |
          metadata="$RUNNER_TEMP/markd-draft-assets-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          existing_root="$RUNNER_TEMP/markd-draft-existing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$existing_root"
          mkdir "$existing_root"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$metadata"
          expected="$(printf '%s\n' "$ELECTRON_DMG" "$ELECTRON_ZIP" "$ELECTRON_ZIP_BLOCKMAP" "$ELECTRON_MANIFEST" | sort)"
          actual="$(jq -r '.assets[].name' "$metadata" | sort)"
          unexpected="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual"))"
          test -z "$unexpected" || {
            echo "Draft contains unexpected stale assets:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          }
          for name in "$ELECTRON_DMG" "$ELECTRON_ZIP" "$ELECTRON_ZIP_BLOCKMAP" "$ELECTRON_MANIFEST"; do
            local_path="release/electron/$name"
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' "$metadata")"
            if [ -n "$asset_id" ]; then
              existing="$existing_root/$name"
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$existing"
              cmp "$local_path" "$existing" || {
                echo "Existing draft asset differs and will not be clobbered: $name" >&2
                exit 1
              }
            else
              gh release upload "$RELEASE_TAG" "$local_path"
            fi
          done

      - name: Verify authenticated draft readback
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.VERSION }}
        run: |
          readback="$RUNNER_TEMP/markd-draft-readback-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          metadata="$RUNNER_TEMP/markd-draft-final-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          test ! -e "$readback"
          mkdir "$readback"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$metadata"
          for name in "$ELECTRON_DMG" "$ELECTRON_ZIP" "$ELECTRON_ZIP_BLOCKMAP" "$ELECTRON_MANIFEST"; do
            asset_id="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .id' "$metadata")"
            test -n "$asset_id"
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$readback/$name"
          done
          node scripts/verify-draft-release.mjs "$VERSION" release/electron "$readback" "$metadata"

      - name: Publish canonical release as latest
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ env.VERSION }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      # POST-PUBLISH EVIDENCE: production GitHubProvider resolves stable updates through /latest.
      - name: Verify anonymous public release assets and digests
        if: env.PUBLISH == 'true'
        env:
          # No token is passed: this proves the stable channel is anonymously readable.
          GH_TOKEN: ''
        run: node scripts/verify-remote-release.mjs "$VERSION"

      - name: Isolate production updater state
        if: env.PUBLISH == 'true'
        run: |
          state_root="$(dirname "$PUBLIC_BASELINE_APP")"
          backup_root="$RUNNER_TEMP/markd-updater-backup-public-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          node scripts/updater-hygiene.mjs prepare "$PUBLIC_BASELINE_APP" "$state_root" "$backup_root"
          echo "PUBLIC_HYGIENE_BACKUP=$backup_root" >> "$GITHUB_ENV"

      - name: Verify production GitHub updater relaunch
        if: env.PUBLISH == 'true'
        run: |
          MARKD_BASELINE_EXECUTABLE="$PUBLIC_BASELINE_APP/Contents/MacOS/Markd" \
          MARKD_INSTALLED_APP="$PUBLIC_BASELINE_APP" \
          MARKD_TARGET_VERSION="$VERSION" \
          MARKD_BASELINE_VERSION="$BASELINE_VERSION" \
          MARKD_ALLOWED_TEMP_ROOT="$RUNNER_TEMP" \
            pnpm run test:updater

      - name: Restore production updater state
        if: always() && env.PUBLIC_HYGIENE_BACKUP != ''
        run: node scripts/updater-hygiene.mjs restore "$PUBLIC_HYGIENE_BACKUP"

      - name: Remove isolated release roots
        if: always()
        run: |
          run_key="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          for path in \
            "$RUNNER_TEMP/markd-installed-$run_key" \
            "$RUNNER_TEMP/markd-baseline-$run_key" \
            "$RUNNER_TEMP/markd-release-e2e-local-$run_key" \
            "$RUNNER_TEMP/markd-release-e2e-public-$run_key" \
            "$RUNNER_TEMP/markd-draft-existing-$run_key" \
            "$RUNNER_TEMP/markd-draft-readback-$run_key" \
            "$RUNNER_TEMP/markd-draft-before-$run_key.json" \
            "$RUNNER_TEMP/markd-draft-assets-$run_key.json" \
            "$RUNNER_TEMP/markd-draft-final-$run_key.json"; do
            test "$(dirname "$path")" = "$RUNNER_TEMP" || {
              echo "Refusing to clean release path outside RUNNER_TEMP: $path" >&2
              exit 1
            }
            case "$(basename "$path")" in
              "markd-installed-$run_key" | \
              "markd-baseline-$run_key" | \
              "markd-release-e2e-local-$run_key" | \
              "markd-release-e2e-public-$run_key" | \
              "markd-draft-existing-$run_key" | \
              "markd-draft-readback-$run_key" | \
              "markd-draft-before-$run_key.json" | \
              "markd-draft-assets-$run_key.json" | \
              "markd-draft-final-$run_key.json") rm -rf "$path" ;;
              *) echo "Refusing to clean unexpected release path: $path" >&2; exit 1 ;;
            esac
          done
