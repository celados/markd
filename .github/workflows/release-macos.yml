name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes for the updater manifest
        required: false
        default: Manual notarized build
        type: string
      release_type:
        description: Updater release classification
        required: true
        default: fix
        type: choice
        options:
          - fix
          - feature
      publish:
        description: Upload artifacts to a GitHub Release; requires a tag ref
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed and notarized macOS app
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_ID_CERT_BASE64: ${{ secrets.DEVELOPER_ID_CERT_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CARGO_BUILD_JOBS: 6

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 0

      - name: Prepare persistent workspace
        run: |
          # A killed job can leave tracked files dirty, but ignored incremental outputs should survive.
          git reset --hard --quiet "$GITHUB_SHA"
          git clean -fdq

          target_gb="$(du -sg src-tauri/target 2>/dev/null | cut -f1 || echo 0)"
          if [ "${target_gb:-0}" -gt 30 ]; then
            rm -rf src-tauri/target
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Rust
        run: |
          cargo_bin="$HOME/.cargo/bin"
          export PATH="$cargo_bin:$PATH"
          echo "$cargo_bin" >> "$GITHUB_PATH"
          echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"

          # This persistent runner should not need rust-lang.org to be healthy for every release.
          if command -v rustup >/dev/null && rustup run stable rustc --version >/dev/null 2>&1; then
            rustup run stable rustc --version
            exit 0
          fi

          if ! command -v rustup >/dev/null; then
            installer="$RUNNER_TEMP/rustup-init.sh"
            curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs -o "$installer"
            sh "$installer" -y --profile minimal --default-toolchain none --no-modify-path
          fi
          rustup toolchain install stable --profile minimal --no-self-update
          rustup run stable rustc --version

      - name: Validate release contract
        env:
          INPUT_NOTES: ${{ inputs.notes }}
          INPUT_RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          for command in node pnpm cargo rustc codesign security xcrun hdiutil spctl curl shasum openssl; do
            command -v "$command" >/dev/null || {
              echo "Missing required command: $command" >&2
              exit 1
            }
          done

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            test "$GITHUB_REF_NAME" = "v$version" || {
              echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
              exit 1
            }
          fi

          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
          fi
          if [ "$publish" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Publishing requires dispatching a tag ref." >&2
            exit 1
          fi

          notes="${INPUT_NOTES:-Markd $version}"
          release_type="${INPUT_RELEASE_TYPE:-fix}"
          {
            echo "VERSION=$version"
            echo "RELEASE_TYPE=$release_type"
            echo "PUBLISH=$publish"
            echo "RELEASE_NOTES<<MARKD_NOTES"
            echo "$notes"
            echo "MARKD_NOTES"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: |
          pnpm test
          pnpm run typecheck
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Import Developer ID certificate
        run: |
          certificate_path="$RUNNER_TEMP/markd-developer-id.p12"
          intermediate_g2_path="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          keychain_path="$RUNNER_TEMP/markd-signing.keychain-db"
          keychain_list="$RUNNER_TEMP/markd-keychains-before.txt"

          security list-keychains -d user > "$keychain_list"
          security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          printf '%s' "$DEVELOPER_ID_CERT_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          chmod 600 "$certificate_path"

          # This P12 is issued by Developer ID G2; importing the same-CN G1 chain confuses codesign.
          # https://developer.apple.com/support/developer-id-intermediate-certificate/
          curl -fsSL \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            -o "$intermediate_g2_path"
          intermediate_g2_sha="$(shasum -a 256 "$intermediate_g2_path" | awk '{print $1}')"
          test "$intermediate_g2_sha" = "f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a"

          # codesign only constructs Developer ID chains reliably from a system-installed intermediate.
          # The self-hosted runner persists System.keychain across jobs, so repeat runs must be idempotent.
          intermediate_g2_fingerprint="$(
            openssl x509 \
              -inform der \
              -in "$intermediate_g2_path" \
              -noout \
              -fingerprint \
              -sha1 | cut -d= -f2 | tr -d ':'
          )"
          if ! security find-certificate -a -Z /Library/Keychains/System.keychain |
            grep -q "$intermediate_g2_fingerprint"; then
            sudo -n security import \
              "$intermediate_g2_path" \
              -k /Library/Keychains/System.keychain >/dev/null
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$P12_PASSWORD" \
            -f pkcs12 \
            -k "$keychain_path" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path" >/dev/null

          existing_keychains=()
          while IFS= read -r line; do
            existing_keychains+=("${line//\"/}")
          done < "$keychain_list"
          security list-keychains -d user -s "$keychain_path" "${existing_keychains[@]}"

          identity_output="$(security find-identity -v -p codesigning "$keychain_path")"
          # A fingerprint selects this imported certificate even if the runner has an older namesake.
          identity="$(awk '/"Developer ID Application:/ {print $2; exit}' <<< "$identity_output")"
          leaf_pem="$RUNNER_TEMP/markd-developer-id.pem"
          security find-certificate \
            -c "Developer ID Application:" \
            -p \
            "$keychain_path" > "$leaf_pem"
          if [ -z "$identity" ]; then
            echo "The imported certificate has no Developer ID Application identity." >&2
            echo "$identity_output" >&2

            openssl x509 \
              -in "$leaf_pem" \
              -noout \
              -subject \
              -issuer \
              -dates \
              -fingerprint \
              -sha256 >&2
            security find-key -t private "$keychain_path" >&2 || true
            security verify-cert -c "$leaf_pem" -p codesigning -v >&2 || true
            exit 1
          fi

          security verify-cert \
            -c "$leaf_pem" \
            -k "$keychain_path" \
            -p codeSign \
            -v

          # Fail before compilation if this headless runner cannot use the imported identity.
          codesign_probe="$RUNNER_TEMP/markd-codesign-probe"
          cp /usr/bin/true "$codesign_probe"
          codesign \
            --force \
            --timestamp \
            --sign "$identity" \
            "$codesign_probe"
          codesign --verify --strict --verbose=2 "$codesign_probe"

          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_KEYCHAIN_PATH=$keychain_path"
          } >> "$GITHUB_ENV"

      - name: Build, sign, and notarize release
        run: |
          # Keychain unlock state is not reliable across isolated Actions step processes.
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$APPLE_KEYCHAIN_PATH"
          bash scripts/release.sh "$VERSION" "--type=$RELEASE_TYPE" "$RELEASE_NOTES"

      - name: Collect verified artifacts
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -type f -name "Markd_${VERSION}_*.dmg" -print -quit)"
          test -n "$dmg"

          mkdir -p release-artifacts
          cp "$dmg" "release-artifacts/Markd_${VERSION}_aarch64.dmg"
          cp src-tauri/target/release/bundle/macos/Markd.app.tar.gz release-artifacts/Markd.app.tar.gz
          cp src-tauri/target/release/bundle/macos/Markd.app.tar.gz.sig release-artifacts/Markd.app.tar.gz.sig
          cp latest.json release-artifacts/latest.json

      - name: Keep verified workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: markd-macos-${{ env.VERSION }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: env.PUBLISH == 'true'
        env:
          RELEASE_TAG: v${{ env.VERSION }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Markd ${VERSION}" || \
            gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" release-artifacts/* --clobber

      - name: Clean signing material and checkout
        if: always()
        run: |
          keychain_path="$RUNNER_TEMP/markd-signing.keychain-db"
          keychain_list="$RUNNER_TEMP/markd-keychains-before.txt"

          if [ -f "$keychain_list" ]; then
            previous_keychains=()
            while IFS= read -r line; do
              previous_keychains+=("${line//\"/}")
            done < "$keychain_list"
            if [ "${#previous_keychains[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${previous_keychains[@]}" || true
            fi
          fi

          security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
          rm -f \
            "$RUNNER_TEMP/markd-developer-id.p12" \
            "$RUNNER_TEMP/markd-developer-id.pem" \
            "$RUNNER_TEMP/markd-codesign-probe" \
            "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            "$keychain_list"
          git reset --hard --quiet "$GITHUB_SHA" || true
          git clean -fdq || true
