name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and typecheck
    # fff publishes only the macOS binding Markd consumes. Fork PRs must not
    # execute arbitrary code on the persistent org runner.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          clean: false

      - name: Prepare persistent workspace
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          git reset --hard --quiet "$GITHUB_SHA"
          git clean -fdq
          # Preserve the expensive dependency tree while removing ignored config
          # that could otherwise make this stateful runner non-reproducible.
          git clean -fdqx -e /node_modules/
          node_modules_gib="$(du -sg node_modules 2>/dev/null | cut -f1 || echo 0)"
          if [ "${node_modules_gib:-0}" -gt 20 ]; then
            rm -rf node_modules
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.celados.com
          scope: '@celados'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Run browser journeys in system Google Chrome
        run: pnpm run test:browser

      - name: Run Electron desktop smoke tests
        env:
          MARKD_E2E_BACKGROUND: "1"
        run: pnpm exec playwright test --config playwright.electron.config.ts

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
